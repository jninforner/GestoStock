:root{--bg:#f6f8fb;--tx:#203a55;--mu:#63798d;--ln:#285b78;--g1:#fff;--g2:#f1f6f9;--in:#fff;--on:#fff;--rd:#b42318;--gr:#17734a}

</main>
<script>
var state={fish:[],sales:[],noms:[]},ref=null,confirmId=null,sellId=null,editId=null,openId=null,nmsg="",KEY="peixos-v1";
function $(i){return document.getElementById(i)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function eur(n){return Number(n).toLocaleString("ca-ES",{style:"currency",currency:"EUR"})}
function kg(n){return Number(n).toLocaleString("ca-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" kg"}
function dt(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var PREPS={sencer:"Sencer",palometa:"En palometa",filets:"A filets",talls:"A talls"};
var DEFAULT_CONFIG={iva:10,paxMin:400,paxMax:500,arrodoniment:0.5,trams:[{cost:5,mult:5},{cost:10,mult:4},{cost:20,mult:3},{cost:30,mult:2.5},{cost:40,mult:2.2}]};
function defaults(){return JSON.parse(JSON.stringify(DEFAULT_CONFIG))}
function conf(){return Object.assign(defaults(),state.config||{})}
function fin(f){return f.pesNetIndividual!=null?Number(f.pesNetIndividual):f.tipus==="palometa"?f.pes*(1-(f.minva||0)/100):f.pes}
function cost(f){return (f.costNetKg!=null?f.costNetKg*fin(f):f.preuCompra*f.pes)*(f.unitats||1)}
function rev(f){return f.preuVenda*fin(f)*(f.unitats||1)}
function wtxt(f){return "Pes final <b>"+kg(fin(f))+"</b>"+(f.lotId?" · Partida "+esc(f.lotId.slice(-6)):"")}
function tag(f){return PREPS[f.tipus]||f.tipus||"Sencer"}
function multiplicador(c){var pts=conf().trams.slice().sort(function(a,b){return a.cost-b.cost});if(!pts.length)return 3;if(c<=pts[0].cost)return pts[0].mult;for(var i=1;i<pts.length;i++){if(c<=pts[i].cost){var a=pts[i-1],b=pts[i];return a.mult+(b.mult-a.mult)*(c-a.cost)/(b.cost-a.cost)}}return pts[pts.length-1].mult}
function preuCartaSuggerit(costNetKg,pesNet){
 var cfg=conf(),base=costNetKg*multiplicador(costNetKg)*pesNet*(1+cfg.iva/100),pas=Number(cfg.arrodoniment)||0;
 return pas>0?Math.ceil((base-1e-8)/pas)*pas:Math.round(base*100)/100;
}
function minvaLot(f){var l=(state.lots||[]).find(function(x){return x.id===f.lotId});return l&&l.pesBrut>0&&l.pesNet!=null?(1-l.pesNet/l.pesBrut)*100:null}
function preuSuggerit(c){var cfg=conf(),n=c*multiplicador(c)*(1+cfg.iva/100),r=Number(cfg.arrodoniment)||0;return r>0?Math.ceil((n-1e-8)/r)*r:n}
function norm(){state.fish=state.fish||[];state.sales=state.sales||[];state.noms=state.noms||[];state.lots=state.lots||[];state.config=state.config||defaults();state.fish.concat(state.sales).forEach(function(x){if(x.nom&&state.noms.indexOf(x.nom)<0)state.noms.push(x.nom)});state.noms=state.noms.filter(function(n,i,a){return a.indexOf(n)===i}).sort(function(a,b){return a.localeCompare(b,"ca")})}
function compactarLotsIguals(){
 var lotsNous=state.lots||[], grups=new Map(),resultat=[];
 state.fish.forEach(function(f){
  var l=lotsNous.find(function(x){return x.id===f.lotId});
  if(!l||l.pesosIguals!==true){resultat.push(f);return}
  var key=[f.lotId,f.nom,f.tipus,Number(fin(f)).toFixed(6),Number(f.preuVenda).toFixed(4),f.dataCompra].join("|");
  if(grups.has(key)){grups.get(key).unitats+=(Number(f.unitats)||1)}
  else{var copia=Object.assign({},f,{unitats:Number(f.unitats)||1});grups.set(key,copia);resultat.push(copia)}
 });
 state.fish=resultat;
}
function fillNames(sel){var s=$("ns"),h="";state.noms.forEach(function(n){h+='<option value="'+esc(n).replace(/"/g,"&quot;")+'">'+esc(n)+'</option>'});s.innerHTML=h;var keep=sel==="__new",tv=$("nom").value;s.value=(sel&&state.noms.indexOf(sel)>=0?sel:(state.noms.length?state.noms[0]:""));$("nom").hidden=true;$("nom").value=""}
function curNom(){var v=$("ns").value;return (v||"").trim()}
var lastUndo=null,tt=null;
function sellOne(id){var ix=-1;state.fish.forEach(function(x,i){if(x.id===id)ix=i});if(ix<0)return;var f=state.fish[ix],have=f.unitats||1,sid=uid();state.sales.push({id:sid,nom:f.nom,tipus:f.tipus,minva:f.minva,pes:f.pes,unitats:1,dataCompra:f.dataCompra,preuCompra:f.preuCompra,preuVenda:carta(f)/fin(f),costNetKg:f.costNetKg,pesNetIndividual:f.pesNetIndividual,lotId:f.lotId,dataVenda:today()});var copy=JSON.parse(JSON.stringify(f));if(have<=1){state.fish.splice(ix,1)}else{f.unitats=have-1}lastUndo={sid:sid,fish:copy,ix:ix,removed:have<=1};sellId=null;confirmId=null;save();render();showToast("Venuda 1 u. · "+f.nom+(have<=1?" (s’ha acabat)":" · en queden "+(have-1)))}
function undoSale(){if(!lastUndo)return;var u=lastUndo;state.sales=state.sales.filter(function(s){return s.id!==u.sid});if(u.removed){state.fish.splice(Math.min(u.ix,state.fish.length),0,u.fish)}else{state.fish.forEach(function(x){if(x.id===u.fish.id)x.unitats=u.fish.unitats})}lastUndo=null;$("toast").hidden=true;save();render()}
function showToast(m){var t=$("toast");t.innerHTML='<span>'+esc(m)+'</span><button data-undo="1">Desfés</button>';t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;lastUndo=null},6000)}
function flash(m){var t=$("toast");t.innerHTML='<span>'+esc(m)+'</span>';t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2500)}
function renderStock(){var h="";var visible=state.fish.filter(function(f){return !f.lotId||state.lots.some(function(l){return l.id===f.lotId&&l.validada})});if(!visible.length)h='<div class="empty">No hi ha peixos a l’estoc.</div>';visible.forEach(function(f){if(editId===f.id){h+=editForm(f);return}var u=f.unitats||1,op=openId===f.id;h+='<div class="card" style="padding:0;border-radius:0 28px 0 28px"><div class="row" data-open="'+f.id+'" style="padding:14px 20px;align-items:center"><div><div class="nm">'+esc(f.nom)+'</div><div class="mu">'+tag(f)+' · '+kg(f.pes)+' · '+u+' u.</div></div><div style="text-align:right"><div class="nm">'+eur(carta(f))+'</div><div class="mu">'+(op?'▴':'▾')+'</div></div></div>';if(op){h+='<div style="padding:0 20px 16px"><div class="mu">Comprat el '+dt(f.dataCompra)+'</div><div class="mu">'+wtxt(f)+'</div><div class="mu">Compra en brut: '+eur(f.preuCompra)+'/kg</div><div class="mu">Minva real de la partida: '+(minvaLot(f)==null?'No disponible':n2(minvaLot(f))+'%')+'</div><div class="mu">Cost real després de la minva: '+(f.costNetKg!=null?eur(f.costNetKg)+'/kg net':'No disponible')+'</div><div class="mu">Multiplicador aplicat: '+(f.costNetKg!=null&&Number(f.costNetKg)>0?'×'+n2(multiplicador(Number(f.costNetKg))):'No disponible')+'</div><div class="mu">Pes net per exemplar: '+kg(fin(f))+'</div><div class="mu">Preu final de carta (per peix, IVA inclòs): <b>'+eur(carta(f))+'</b></div><div class="act">';if(confirmId===f.id){h+='<span class="mu">Segur?</span><button class="s d" data-del2="'+f.id+'">Sí, elimina</button><button class="s" data-no="1">No</button>'}else{h+='<button class="s f" data-sell="'+f.id+'">Ven 1 u.</button><button class="s" data-edit="'+f.id+'">Edita</button><button class="s d" data-del="'+f.id+'">Elimina</button>'}h+='</div></div>'}h+='</div>'});$("stock").innerHTML=h}
function n2(v){return Number(v).toLocaleString("ca-ES",{minimumFractionDigits:2,maximumFractionDigits:2})}
// Generador PDF integrat: no necessita internet ni serveis de Claude.
function makePdf(mode){
 if(!state.fish.some(function(f){return !f.lotId||state.lots.some(function(l){return l.id===f.lotId&&l.validada})})){flash("No hi ha peixos a l’estoc");return}
 var W=842,H=595, pages=[],cmd=[],y=0;
 function clean(t){return String(t).replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,"-").replace(/\u00a0/g," ")}
 function pdfText(t){return clean(t).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
 function text(t,x,top,size,bold,color){cmd.push((color||"0.17 0.22 0.55")+" rg BT /"+(bold?"F2":"F1")+" "+size+" Tf 1 0 0 1 "+x+" "+(H-top)+" Tm ("+pdfText(t)+") Tj ET")}
 function rect(x,top,w,h,color){cmd.push(color+" rg "+x+" "+(H-top-h)+" "+w+" "+h+" re f")}

 if(d.generate){generateLotFish(l)}else if(d.close){if(Number($("lnet").value)!==Number(l.pesNet)||Number($("lqty").value)!==Number(l.quantitat||0)||($("lsame").value==="si")!==Boolean(l.pesosIguals)){flash("Has canviat dades: torna a generar els peixos abans de validar");return}var a=state.fish.filter(function(f){return f.lotId===id}),sum=a.reduce(function(v,f){return v+fin(f)*(f.unitats||1)},0);if(l.pesNet==null||!a.length||Math.abs(sum-l.pesNet)>.002){flash("Falta quadrar el pes net");return}l.validada=true;save();render();flash("Partida validada")}

  }
};

const app=initializeApp(config),auth=getAuth(app);
let db;

const target=db?doc(db,"inventari","dades"):null;
let unsubscribe=null,ready=false,writeChain=Promise.resolve(),pending=0,received=false;

 status("Carregant inventari…");

 },e=>{status("Error de permisos o connexió: "+e.message);window.showLogin(true);document.getElementById("loginError").textContent=e.message});
