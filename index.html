<html lang="ca">
<head>

<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#2e3a8c"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="./icon.png">
<style>
:root{--bg:#fff;--tx:#2e3a8c;--mu:#6a73b0;--ln:#2e3a8c;--g1:#ffffff;--g2:#dfe2f3;--in:#fff;--on:#fff;--rd:#b42318;--gr:#1d7a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1230;--tx:#c9d0ff;--mu:#8e98d8;--ln:#7f8cf0;--g1:#141a44;--g2:#1d2560;--in:#0e1230;--on:#0e1230;--rd:#ff8f85;--gr:#6ee08f}}
:root[data-theme="dark"]{--bg:#0e1230;--tx:#c9d0ff;--mu:#8e98d8;--ln:#7f8cf0;--g1:#141a44;--g2:#1d2560;--in:#0e1230;--on:#0e1230;--rd:#ff8f85;--gr:#6ee08f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.35 "Palatino Linotype",Palatino,"Book Antiqua","Iowan Old Style",Georgia,serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:30px;font-weight:400;margin:6px 0 14px;font-variant:small-caps;letter-spacing:.02em}
.sc,label,button,.mu,.nm,select,.tag{font-variant:small-caps}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tabs button{flex:1}
.card{border:2px solid var(--ln);border-radius:0 60px 0 60px;background:linear-gradient(135deg,var(--g1),var(--g2) 50%,var(--g1));padding:16px 20px;margin-bottom:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}

input,select{width:100%;padding:10px 12px;border:2px solid var(--ln);border-radius:14px;background:var(--in);color:var(--tx);font:inherit;font-size:17px;min-height:46px}
select{font-variant:small-caps}
button{font:inherit;font-variant:small-caps;font-size:18px;color:var(--tx);background:transparent;border:2px solid var(--ln);border-radius:0 22px 0 22px;padding:10px 18px;min-height:46px}
button.f,.tabs button.on,#menu button.on{background:var(--ln);color:var(--on)}
button.d{color:var(--rd);border-color:var(--rd)}
button.s{padding:6px 14px;min-height:40px;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .full{grid-column:1/-1}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,40,.5);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}.ov[hidden]{display:none}
#menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);right:16px;z-index:30;display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--bg);border:2px solid var(--ln);border-radius:0 22px 0 22px;min-width:210px}
#menu[hidden]{display:none}
#menu button{text-align:left;width:100%}
input,select{height:46px}
.g2>div,form>div{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;text-align:left}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--ln);color:var(--on);border-radius:0 22px 0 22px}
#toast[hidden]{display:none}
#toast button{color:var(--on);border-color:var(--on);min-height:36px;padding:4px 12px;font-size:16px}
.x{min-height:40px;min-width:40px;padding:0;font-size:20px;line-height:1}
.sheet{width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--bg);margin:0}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nm{font-size:24px}
.mu{color:var(--mu);font-size:16px}
.big{font-size:34px;line-height:1.1}
.act{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.act input{width:100px;padding:6px 10px;min-height:40px}
.sum{display:flex;gap:8px;margin-bottom:14px}
.sum div{flex:1;border:2px solid var(--ln);border-radius:0 22px 0 22px;padding:10px;text-align:center}
.sum b{display:block;font-weight:400;font-size:22px}
.pos{color:var(--gr)}.neg{color:var(--rd)}
.empty{text-align:center;color:var(--mu);padding:24px}
</style>
</head>
<body>
<div id="login" style="position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="width:100%;max-width:420px"><h1>Control de peixos</h1><p>Accedeix amb el teu usuari de Firebase.</p><form id="loginForm" style="display:block"><label>Correu electrònic</label><input id="email" type="email" autocomplete="username" required><label style="margin-top:12px">Contrasenya</label><input id="password" type="password" autocomplete="current-password" required><button class="f" style="width:100%;margin-top:16px">Entrar</button></form><p class="mu" id="loginError"></p></div></div>
<main><div class="row" style="align-items:center;gap:8px"><span class="mu" id="syncStatus">Connectant…</span><button id="logout" class="s" type="button" style="margin-left:auto">Sortir</button></div>
<div class="row" style="align-items:center"><h1>Control de peixos</h1><button id="mb" class="x" aria-label="Menú">☰</button></div>
<div id="menu" hidden><button id="t0" class="on">Registrar compra</button><button id="t1">Inventari</button><button id="t2">Historial de vendes</button><button id="en">Catàleg de peixos</button></div>
<div id="v1">
  <div class="card"><form id="f">
    <div class="full"><label>Nom</label><select id="ns"></select><input id="nom" placeholder="Nom nou del peix" hidden style="display:none"></div>
    <div><label>Presentació</label><select id="tp"><option value="sencer">Sencer</option><option value="palometa">En palometa</option></select></div>
    <div><label>Pes (kg)</label><input id="pes" type="text" inputmode="decimal" value="0," autocomplete="off" required></div>
    <div class="full" id="kb" style="display:flex;gap:6px;align-items:center"><span class="mu">Kg sencers:</span><button type="button" class="s" data-k="0">0</button><button type="button" class="s" data-k="1">1</button><button type="button" class="s" data-k="2">2</button><button type="button" class="s" data-k="3">3</button><button type="button" class="s" data-k="4">4</button></div>
    <div id="mw" class="full" hidden><label>Merma (%)</label><input id="mm" type="number" inputmode="decimal" step="0.1" min="0" max="100" placeholder="Ex. 18"><div class="mu" id="pf"></div></div>
    <div><label>Data de compra</label><input id="dc" type="date" required></div><div><label>Quantitat</label><input id="un" type="number" inputmode="numeric" step="1" min="1" value="1" required></div>
    <div><label>Preu de compra (€/kg)</label><input id="pc" type="number" inputmode="decimal" step="0.01" min="0" required></div>
    <div><label>Preu de venda (€/kg)</label><input id="pv" type="number" inputmode="decimal" step="0.01" min="0" required></div>
    <div class="full mu" id="cp"></div>
    <button class="f full" type="submit">Afegir peix</button>
  </form></div>
  <div id="np" hidden></div>
  <div id="toast" hidden></div>
  </div>
<div id="v3" hidden><div class="act" style="margin:0 0 12px"><button id="pdf" class="s f">Genera PDF</button></div><div id="stock"></div>
</div>
<div id="v2" hidden><div id="sum" class="sum"></div><div id="sales"></div></div>
</main>
<script>
var state={fish:[],sales:[],noms:[]},ref=null,confirmId=null,sellId=null,editId=null,openId=null,nmsg="",KEY="peixos-v1";
function $(i){return document.getElementById(i)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function eur(n){return Number(n).toLocaleString("ca-ES",{style:"currency",currency:"EUR"})}
function kg(n){return Number(n).toLocaleString("ca-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" kg"}
function dt(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fin(f){return f.tipus==="palometa"?f.pes*(1-(f.merma||0)/100):f.pes}
function cost(f){return f.preuCompra*f.pes*(f.unitats||1)}
function rev(f){return f.preuVenda*fin(f)*(f.unitats||1)}
function wtxt(f){var u=f.unitats||1,t=u>1?" · total <b>"+kg(fin(f)*u)+"</b>":"";return f.tipus==="palometa"?"Pes final <b>"+kg(fin(f))+"</b> (merma "+f.merma+" %)"+t:"Pes final <b>"+kg(f.pes)+"</b> (sense merma)"+t}
function tag(f){return f.tipus==="palometa"?"En palometa":"Sencer"}
function norm(){state.fish=state.fish||[];state.sales=state.sales||[];state.noms=state.noms||[];state.fish.concat(state.sales).forEach(function(x){if(x.nom&&state.noms.indexOf(x.nom)<0)state.noms.push(x.nom)});state.noms=state.noms.filter(function(n,i,a){return a.indexOf(n)===i}).sort(function(a,b){return a.localeCompare(b,"ca")})}
function fillNames(sel){var s=$("ns"),h="";state.noms.forEach(function(n){h+='<option value="'+esc(n).replace(/"/g,"&quot;")+'">'+esc(n)+'</option>'});s.innerHTML=h;var keep=sel==="__new",tv=$("nom").value;s.value=(sel&&state.noms.indexOf(sel)>=0?sel:(state.noms.length?state.noms[0]:""));$("nom").hidden=true;$("nom").value=""}
function curNom(){var v=$("ns").value;return (v||"").trim()}
var lastUndo=null,tt=null;
function sellOne(id){var ix=-1;state.fish.forEach(function(x,i){if(x.id===id)ix=i});if(ix<0)return;var f=state.fish[ix],have=f.unitats||1,sid=uid();state.sales.push({id:sid,nom:f.nom,tipus:f.tipus,merma:f.merma,pes:f.pes,unitats:1,dataCompra:f.dataCompra,preuCompra:f.preuCompra,preuVenda:f.preuVenda,dataVenda:today()});var copy=JSON.parse(JSON.stringify(f));if(have<=1){state.fish.splice(ix,1)}else{f.unitats=have-1}lastUndo={sid:sid,fish:copy,ix:ix,removed:have<=1};sellId=null;confirmId=null;save();render();showToast("Venuda 1 u. · "+f.nom+(have<=1?" (s’ha acabat)":" · en queden "+(have-1)))}
function undoSale(){if(!lastUndo)return;var u=lastUndo;state.sales=state.sales.filter(function(s){return s.id!==u.sid});if(u.removed){state.fish.splice(Math.min(u.ix,state.fish.length),0,u.fish)}else{state.fish.forEach(function(x){if(x.id===u.fish.id)x.unitats=u.fish.unitats})}lastUndo=null;$("toast").hidden=true;save();render()}
function showToast(m){var t=$("toast");t.innerHTML='<span>'+esc(m)+'</span><button data-undo="1">Desfés</button>';t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;lastUndo=null},6000)}
function flash(m){var t=$("toast");t.innerHTML='<span>'+esc(m)+'</span>';t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2500)}
function renderStock(){var h="";if(!state.fish.length)h='<div class="empty">No hi ha peixos a l’estoc.</div>';state.fish.forEach(function(f){if(editId===f.id){h+=editForm(f);return}var u=f.unitats||1,op=openId===f.id;h+='<div class="card" style="padding:0;border-radius:0 28px 0 28px"><div class="row" data-open="'+f.id+'" style="padding:14px 20px;align-items:center"><div><div class="nm">'+esc(f.nom)+'</div><div class="mu">'+tag(f)+' · '+kg(f.pes)+' · '+u+' u.</div></div><div style="text-align:right"><div class="nm">'+eur(carta(f))+'</div><div class="mu">'+(op?'▴':'▾')+'</div></div></div>';if(op){h+='<div style="padding:0 20px 16px"><div class="mu">Comprat el '+dt(f.dataCompra)+'</div><div class="mu">'+wtxt(f)+'</div><div class="mu">Compra '+eur(f.preuCompra)+'/kg · Venda '+eur(f.preuVenda)+'/kg</div><div class="mu">Carta (per unitat) <b>'+eur(carta(f))+'</b></div><div class="act">';if(confirmId===f.id){h+='<span class="mu">Segur?</span><button class="s d" data-del2="'+f.id+'">Sí, elimina</button><button class="s" data-no="1">No</button>'}else{h+='<button class="s f" data-sell="'+f.id+'">Ven 1 u.</button><button class="s" data-edit="'+f.id+'">Edita</button><button class="s d" data-del="'+f.id+'">Elimina</button>'}h+='</div></div>'}h+='</div>'});$("stock").innerHTML=h}
function n2(v){return Number(v).toLocaleString("ca-ES",{minimumFractionDigits:2,maximumFractionDigits:2})}
// Generador PDF integrat: no necessita internet ni serveis de Claude.
function makePdf(){
 if(!state.fish.length){flash("No hi ha peixos a l’estoc");return}
 var W=842,H=595, pages=[],cmd=[],y=0;
 function clean(t){return String(t).replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,"-").replace(/\u00a0/g," ")}
 function pdfText(t){return clean(t).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
 function text(t,x,top,size,bold,color){cmd.push((color||"0.17 0.22 0.55")+" rg BT /"+(bold?"F2":"F1")+" "+size+" Tf 1 0 0 1 "+x+" "+(H-top)+" Tm ("+pdfText(t)+") Tj ET")}
 function rect(x,top,w,h,color){cmd.push(color+" rg "+x+" "+(H-top-h)+" "+w+" "+h+" re f")}
 var cols=[{title:"Nom i preparació",x:42},{title:"Pes final (kg)",x:295},{title:"Pax",x:430},{title:"Preu carta (EUR)",x:525},{title:"Data compra",x:690}];
 function pax(w){if(!(w>0))return "1";var min=Math.max(1,Math.ceil((w-1e-9)/0.5)),max=Math.max(1,Math.floor((w+1e-9)/0.4));return min>max?String(Math.max(1,Math.round(w/0.45))):min===max?String(min):min+"-"+max}
 function start(){cmd=[];text("Inventari de peixos",42,45,21,true);text("Data: "+dt(today()),42,65,11,false);rect(36,83,770,30,"0.18 0.23 0.55");cols.forEach(function(c){text(c.title,c.x,103,11,true,"1 1 1")});y=113}
 function finish(){pages.push(cmd.join("\n"))}
 start();var tu=0,tw=0;
 state.fish.forEach(function(f,i){if(y>530){finish();start()}var u=f.unitats||1;tu+=u;tw+=fin(f)*u;if(i%2===0)rect(36,y,770,30,"0.93 0.94 0.98");var vals=[f.nom+" - "+tag(f),n2(fin(f)),pax(fin(f)),n2(carta(f)),dt(f.dataCompra)];vals.forEach(function(v,j){text(String(v).slice(0,j===0?27:28),cols[j].x,y+20,11,false,"0.13 0.16 0.27")});y+=30});
 if(y>520){finish();start()}text("Total unitats: "+tu+"     Pes final total: "+n2(tw)+" kg",42,y+25,12,true);finish();
 // PDF 1.4 amb fonts estàndard Helvetica, codificació WinAnsi.
 var objects=[null],add=function(o){objects.push(o);return objects.length-1};
 var catalog=add(""),root=add(""),font1=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"),font2=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
 var kids=[];pages.forEach(function(content){var stream=add("<< /Length "+byteLen(content)+" >>\nstream\n"+content+"\nendstream");var page=add("<< /Type /Page /Parent "+root+" 0 R /MediaBox [0 0 842 595] /Resources << /Font << /F1 "+font1+" 0 R /F2 "+font2+" 0 R >> >> /Contents "+stream+" 0 R >>");kids.push(page+" 0 R")});objects[catalog]="<< /Type /Catalog /Pages "+root+" 0 R >>";objects[root]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+kids.length+" >>";
 var out="%PDF-1.4\n%âãÏÓ\n",offsets=[0];for(var i=1;i<objects.length;i++){offsets.push(byteLen(out));out+=i+" 0 obj\n"+objects[i]+"\nendobj\n"}var xref=byteLen(out);out+="xref\n0 "+objects.length+"\n0000000000 65535 f \n";for(var i=1;i<objects.length;i++)out+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";out+="trailer\n<< /Size "+objects.length+" /Root "+catalog+" 0 R >>\nstartxref\n"+xref+"\n%%EOF";
 var bytes=toBytes(out),blob=new Blob([bytes],{type:"application/pdf"}),name="inventari-peixos-"+today()+".pdf";
 // En iOS, el full de compartir és més fiable que la descàrrega convencional.
 if(navigator.share&&typeof File!=="undefined"){
  var file=new File([blob],name,{type:"application/pdf"});
  if(!navigator.canShare||navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Inventari de peixos"}).catch(function(e){if(e.name!=="AbortError")downloadPdf(blob,name)});return}
 }
 downloadPdf(blob,name);
}
function toBytes(s){var b=new Uint8Array(s.length);for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);b[i]=c===8364?128:c<=255?c:63}return b}
function byteLen(s){return s.length}
function downloadPdf(blob,name){var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},60000);flash("PDF generat. Si no s'obre, comprova les descàrregues del visor.")}
function pn(s){return parseFloat(String(s).replace(",","."))}
function carta(f){return f.preuVenda*fin(f)}
function editForm(f){var p=f.tipus==="palometa",nv=esc(f.nom).replace(/"/g,"&quot;");return '<div class="card"><div class="g2"><div class="full"><label>Nom</label><input id="e_nom" value="'+nv+'"></div><div><label>Presentació</label><select id="e_tp"><option value="sencer"'+(p?"":" selected")+'>Sencer</option><option value="palometa"'+(p?" selected":"")+'>En palometa</option></select></div><div><label>Pes (kg)</label><input id="e_pes" type="number" inputmode="decimal" step="0.01" min="0" value="'+f.pes+'"></div><div class="full"><label>Merma (%) · només en palometa</label><input id="e_mm" type="number" inputmode="decimal" step="0.1" min="0" max="100" value="'+(f.merma||0)+'"></div><div><label>Data de compra</label><input id="e_dc" type="date" value="'+f.dataCompra+'"></div><div><label>Quantitat</label><input id="e_un" type="number" inputmode="numeric" step="1" min="1" value="'+(f.unitats||1)+'"></div><div><label>Compra (€/kg)</label><input id="e_pc" type="number" inputmode="decimal" step="0.01" min="0" value="'+f.preuCompra+'"></div><div><label>Venda (€/kg)</label><input id="e_pv" type="number" inputmode="decimal" step="0.01" min="0" value="'+f.preuVenda+'"></div></div><div class="act"><button class="s f" data-save="'+f.id+'">Desa</button><button class="s" data-no="1">Cancel·la</button></div></div>'}
function saveEdit(id){var f=state.fish.filter(function(x){return x.id===id})[0];if(!f)return;var nm=$("e_nom").value.trim(),p=$("e_tp").value==="palometa",w=parseFloat($("e_pes").value),m=parseFloat($("e_mm").value)||0,dc=$("e_dc").value,pc=parseFloat($("e_pc").value),pv=parseFloat($("e_pv").value),un=Math.max(1,parseInt($("e_un").value)||1);if(!nm||isNaN(w)||!dc||isNaN(pc)||isNaN(pv)||(p&&(m<0||m>100)))return;f.nom=nm;f.tipus=p?"palometa":"sencer";f.merma=p?m:0;f.pes=w;f.dataCompra=dc;f.preuCompra=pc;f.preuVenda=pv;f.unitats=un;if(state.noms.indexOf(nm)<0)state.noms.push(nm);editId=null;norm();fillNames($("ns").value);save();render()}
function renderNames(){var h='<div class="card"><label>Nom nou</label><div class="act" style="margin:0;flex-wrap:nowrap"><input id="nn" placeholder="Ex. Orada" style="flex:1;width:auto"><button class="s f" data-na="1">Afegeix</button></div></div><div class="card">'+(state.noms.length?'':'<div class="mu">Encara no hi ha cap nom.</div>');h+=(nmsg?'<div class="neg" style="margin-bottom:8px">'+nmsg+'</div>':'');state.noms.forEach(function(n,i){h+='<div class="act" style="flex-wrap:nowrap"><input data-ni="'+i+'" value="'+esc(n).replace(/"/g,"&quot;")+'" style="flex:1;width:auto"><button class="s d" data-nd="'+i+'">Elimina</button></div>'});h+='</div>';$("np").innerHTML=h}
function save(){
 if(!window.peixosSync || !window.peixosSync.ready){flash("Sense sessió: no s'ha desat el canvi");return}
 window.peixosSync.save({fish:state.fish,sales:state.sales,noms:state.noms});
}
function render(){
  var h="";
  if(!state.fish.length)h='<div class="empty">No hi ha peixos a l’estoc.</div>';
  state.fish.forEach(function(f){if(editId===f.id){h+=editForm(f);return}
    h+='<div class="card"><div class="row"><div><div class="nm">'+esc(f.nom)+' · '+tag(f)+' · '+kg(f.pes)+' · '+(f.unitats||1)+' u.</div><div class="mu">comprat el '+dt(f.dataCompra)+'</div><div class="mu">'+wtxt(f)+'</div></div><div style="text-align:right"><div class="mu">Compra '+eur(f.preuCompra)+'/kg</div><div class="mu">Venda '+eur(f.preuVenda)+'/kg</div><div class="nm">Carta '+eur(carta(f))+'</div></div></div><div class="act">';
    if(sellId===f.id){h+='<input id="sq" type="number" inputmode="numeric" step="1" min="1" max="'+(f.unitats||1)+'" value="1" style="width:70px"><span class="mu">u.</span><input id="sp" type="number" inputmode="decimal" step="0.01" value="'+f.preuVenda+'"><span class="mu">€/kg</span><input id="sd" type="date" value="'+today()+'" style="width:150px"><button class="s f" data-ok="'+f.id+'">Confirma</button><button class="s" data-no="1">Cancel·la</button>'}
    else if(confirmId===f.id){h+='<span class="mu">Segur?</span><button class="s d" data-del2="'+f.id+'">Sí, elimina</button><button class="s" data-no="1">No</button>'}
    else{h+='<button class="s f" data-sell="'+f.id+'">Ven 1 u.</button><button class="s" data-edit="'+f.id+'">Edita</button><button class="s d" data-del="'+f.id+'">Elimina</button>'}
    h+='</div></div>';
  });
  $("stock").innerHTML=h;
  var inv=0,tot=0,w=0;
  state.sales.forEach(function(s){inv+=cost(s);tot+=rev(s);w+=fin(s)});
  var ben=tot-inv;
  $("sum").innerHTML='<div><span class="mu">Vendes</span><b>'+state.sales.length+'</b></div><div><span class="mu">Ingressos</span><b>'+eur(tot)+'</b></div><div><span class="mu">Benefici</span><b class="'+(ben>=0?"pos":"neg")+'">'+eur(ben)+'</b></div>';
  var s="";
  if(!state.sales.length)s='<div class="empty">Encara no hi ha vendes.</div>';
  state.sales.slice().sort(function(a,b){return b.dataVenda.localeCompare(a.dataVenda)}).forEach(function(v){
    var b=rev(v)-cost(v);
    s+='<div class="card"><div class="row"><div><div class="nm">'+esc(v.nom)+' · '+tag(v)+' · '+kg(v.pes)+' · '+(v.unitats||1)+' u.</div><div class="mu">venut el '+dt(v.dataVenda)+'</div><div class="mu">'+wtxt(v)+'</div><div class="mu">Comprat el '+dt(v.dataCompra)+'</div></div><div style="text-align:right"><div class="mu">Compra '+eur(v.preuCompra)+'/kg · '+eur(cost(v))+'</div><div class="mu">Venda '+eur(v.preuVenda)+'/kg · '+eur(rev(v))+'</div><div class="mu">Carta '+eur(carta(v))+'</div><div class="'+(b>=0?"pos":"neg")+'">'+(b>=0?"+":"")+eur(b)+'</div></div></div></div>';
  });
  $("sales").innerHTML=s;renderStock();
}
function tab(n){$("menu").hidden=true;$("v1").hidden=n!==0;$("v3").hidden=n!==1;$("v2").hidden=n!==2;$("np").hidden=n!==3;if(n===3){nmsg="";renderNames()};["t0","t1","t2","en"].forEach(function(id,i){$(id).className=i===n?"on":""});window.scrollTo(0,0)}

$("np").onclick=function(e){var d=e.target.dataset;if(!d)return;var cur=$("ns").value;if(d.na!==undefined){var v=$("nn").value.trim();if(!v){$("nn").focus();return}if(state.noms.indexOf(v)<0){state.noms.push(v);norm();fillNames(cur==="__new"&&!$("nom").value?v:cur);save();nmsg=""}else{nmsg="Aquest nom ja existeix."}renderNames();return}if(d.nr!==undefined){var i=+d.nr,old=state.noms[i],nw=$("np").querySelector('[data-ni="'+i+'"]').value.trim();if(!nw||nw===old)return;state.fish.concat(state.sales).forEach(function(x){if(x.nom===old)x.nom=nw});state.noms[i]=nw;norm();fillNames(cur===old?nw:cur);nmsg="";save();renderNames();render()}else if(d.nd!==undefined){var n=state.noms[+d.nd];if(state.fish.concat(state.sales).some(function(x){return x.nom===n})){nmsg="No es pot eliminar: hi ha peixos amb aquest nom."}else{state.noms.splice(+d.nd,1);nmsg="";save();fillNames(cur===n?"":cur)}renderNames()}};
$("f").onsubmit=function(e){
  e.preventDefault();
  var p=$("tp").value==="palometa",m=parseFloat($("mm").value);
  if(!(pn($("pes").value)>0)){$("pes").focus();return}if(p&&(isNaN(m)||m<0||m>100)){$("mm").focus();return}
  var nm=curNom();if(!nm){($("ns").value==="__new"?$("nom"):$("ns")).focus();return}if(state.noms.indexOf(nm)<0)state.noms.push(nm);norm();state.fish.unshift({id:uid(),nom:nm,tipus:$("tp").value,merma:p?m:0,pes:pn($("pes").value),unitats:Math.max(1,parseInt($("un").value)||1),dataCompra:$("dc").value,preuCompra:parseFloat($("pc").value),preuVenda:parseFloat($("pv").value)});
  $("f").reset();$("dc").value=today();fillNames(nm);prev();save();render();flash("Afegit: "+nm);
};
$("stock").onclick=function(e){var o=e.target.closest("[data-open]");if(o&&!e.target.closest("button")){openId=openId===o.dataset.open?null:o.dataset.open;sellId=null;confirmId=null;render();return}
  var d=e.target.dataset;if(!d)return;
  if(d.sell){sellOne(d.sell);}
  else if(d.del){confirmId=d.del;sellId=null;render();}
  else if(d.no){sellId=null;confirmId=null;editId=null;render();}
  else if(d.edit){editId=d.edit;sellId=null;confirmId=null;render();}
  else if(d.save){saveEdit(d.save);}
  else if(d.del2){state.fish=state.fish.filter(function(f){return f.id!==d.del2});confirmId=null;save();render();}
  else if(d.ok){
    var f=state.fish.filter(function(x){return x.id===d.ok})[0];if(!f)return;
    var p=parseFloat($("sp").value),dv=$("sd").value,have=f.unitats||1,q=Math.min(have,Math.max(1,parseInt($("sq").value)||1));if(isNaN(p)||!dv)return;
    state.sales.push({id:f.id,nom:f.nom,tipus:f.tipus,merma:f.merma,pes:f.pes,unitats:q,dataCompra:f.dataCompra,preuCompra:f.preuCompra,preuVenda:p,dataVenda:dv});
    if(q>=have){state.fish=state.fish.filter(function(x){return x.id!==f.id})}else{f.unitats=have-q}sellId=null;save();render();
  }
};
norm();fillNames();render();
window.applyCloudState=function(d){state={fish:d.fish||[],sales:d.sales||[],noms:d.noms||[]};norm();fillNames($("ns").value);render()};

if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(console.error);

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
const config = {"apiKey": "AIzaSyC1cjraq-OtSvd9w2O6vA4zvQjC2UC8H5k", "authDomain": "control-de-peixos.firebaseapp.com", "projectId": "control-de-peixos", "storageBucket": "control-de-peixos.firebasestorage.app", "messagingSenderId": "194527539713", "appId": "1:194527539713:web:445d5d2405449af4bac600"};
const app=initializeApp(config),auth=getAuth(app);
let db;
try {db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}
catch(e){document.getElementById("syncStatus").textContent="Error de memòria local: "+e.message;}
const target=db?doc(db,"inventari","dades"):null;
let unsubscribe=null,ready=false,writeChain=Promise.resolve(),pending=0,received=false;
function status(t){window.setSyncStatus(t)}
window.peixosSync={ready:false,login:(email,password)=>signInWithEmailAndPassword(auth,email,password),logout:()=>signOut(auth),save:(data)=>{
 if(!ready||!target)return;
 pending++;
 status("Desant…");
 // Serialitza les escriptures per conservar l'ordre de les accions.
 writeChain=writeChain.then(()=>setDoc(target,data)).then(()=>{pending--;status(pending?"Desant…":"Sincronitzat")}).catch(e=>{pending--;status("Error en desar: "+e.message);alert("No s'ha pogut desar el canvi: "+e.message)});
}};
onAuthStateChanged(auth,user=>{
 if(unsubscribe){unsubscribe();unsubscribe=null}
 ready=false;received=false;window.peixosSync.ready=false;
 window.showLogin(!user);
 if(!user){status("Sessió tancada");window.applyCloudState({fish:[],sales:[],noms:[]});return}
 status("Carregant inventari…");
 unsubscribe=onSnapshot(target,{includeMetadataChanges:true},snap=>{
  if(pending && received)return;
  if(snap.exists())window.applyCloudState(snap.data());
  else window.applyCloudState({fish:[],sales:[],noms:[]});
  received=true;ready=true;window.peixosSync.ready=true;
  status(snap.metadata.fromCache?"Dades locals · pendent de connexió":"Sincronitzat");
 },e=>{status("Error de permisos o connexió: "+e.message);window.showLogin(true);document.getElementById("loginError").textContent=e.message});
});
